name: Run coverage tests

on: [workflow_dispatch, workflow_call]

jobs:
  coverage:
    strategy:
      fail-fast: false
      matrix:
        python-version: [pypy3.11, pypy3.12, "3.x"]
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpc-dev lcov
      - name: Install test dependencies
        run: |
          pip install --upgrade pip 'setuptools<80' setuptools_scm
          pip install pytest hypothesis cython mpmath 'numpy; python_version<"3.15"'
      # Build a single instrumented extension: pip's editable install does not
      # propagate CFLAGS to the compiler, so build with setup.py develop once.
      - name: Run coverage tests
        run: |
          CFLAGS="-coverage" python setup.py develop
          pytest test/
          PYTHONPATH=`pwd`/gmpy2 python test_cython/runtests.py
          lcov --capture --directory . --no-external --output-file coverage.info
          cp coverage.info build/coverage-${{ matrix.python-version }}.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            build/coverage-${{ matrix.python-version }}.info
          retention-days: 1
  merge-coverage:
    runs-on: ubuntu-24.04
    needs:
      - coverage
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lcov
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: build/
          merge-multiple: true
      - run: |
          genhtml build/coverage*.info --hierarchical \
            --output-directory build/coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            build/coverage/
            build/coverage*.info